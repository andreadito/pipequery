name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Engine — install, typecheck, build, test
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test

      - name: CLI — install, typecheck, build, test
        working-directory: cli
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test

      - name: Docs — install, build
        working-directory: docs
        run: |
          npm ci
          npm run build

      - name: Demo app — install, build
        working-directory: demo-app
        run: |
          npm ci
          npm run build
